<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Požadavek nelze zpracovat – Autodoprava Kuchař</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box;
      background: #f6f3ec; color: #1a1d1a; font: 18px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    main { max-width: 34rem; }
    .code { margin: 0; font: 700 clamp(5rem, 22vw, 8rem)/1 "Arial Narrow", sans-serif; color: #2c6736; }
    h1 { margin: 0.25em 0 0.5em; font: 700 2rem/1.1 "Arial Narrow", sans-serif; text-transform: uppercase; color: #163a21; }
    p { margin: 0 0 1.5rem; color: #5b625b; }
    .stripe { height: 10px; margin-bottom: 2rem; background: repeating-linear-gradient(-45deg, #b23a2e 0 14px, #fff 14px 28px); }
    a { display: inline-block; min-height: 44px; box-sizing: border-box; margin: 0.25rem; padding: 0.7rem 1.25rem; border: 2px solid #2c6736;
      border-radius: 6px; font-weight: 600; text-decoration: none; text-transform: uppercase; letter-spacing: 0.06em; }
    .primary { background: #2c6736; color: #fff; }
    .secondary { color: #1f4d2b; }
  </style>
</head>
<body>
  <main>
    <div class="stripe" aria-hidden="true"></div>
    <p class="code" aria-hidden="true">422</p>
    <h1>Požadavek nelze zpracovat</h1>
    <p>Požadavek se nepodařilo dokončit. Zkuste stránku obnovit, případně se vraťte na úvod.</p>
    <a class="primary" href="/">Na úvodní stránku</a>
    <a class="secondary" href="tel:+420739291053">Zavolat +420 739 291 053</a>
  </main>
</body>
</html>
